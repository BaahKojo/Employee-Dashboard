<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In-Employee Management System</title>
    <link rel="stylesheet" href="bootstrap.min.css">

</head>

<body>
    <div class="container mx-auto mt-5">
        <div class="row g-0 shadow rounded overflow-hidden mx-auto" style="max-width: 900px;">
            <div class="col-md-6 d-flex flex-column justify-content-center text-center text-white p-5 bg-primary">
                <h1 class="fw-bold ">GoFinance</h1>
                <p class="mb-4 ">The most popular peer to peer lending at SEA</p>
            </div>
            <div class="col-md-6 bg-white d-flex flex-column justify-content-center p-5 ">
                <h3 class="fw-bold ">Hello Again!</h3>
                <p class="text-muted mb-4 ">Welcome Back</p>
                <form>
                    <div class="mb-3">
                        <input type="email" class="form-control rounded-pill py-2" placeholder="Email Address" required></div>
                    <div class="mb-3">
                        <input type="password" class="form-control rounded-pill py-2" placeholder="Password" required>
                    </div>
                    <a href="Dashborad.html"><button type="submit" class="btn btn-primary w-100 rounded-pill py-2 mb-3">Login</button></a>
                </form>
                <div class="text-center">
                    <a href="" class="text-decoration-none text-muted small">Forget Password</a>
                    <p>Don't have an account?</p>
                    <a href="signup.html" class="text-decoration-none text-muted small">Sign Up</a>
                </div>

            </div>

        </div>

    </div>

    <script src="bootstrap.bundle.js "></script>
</body>

</html>
