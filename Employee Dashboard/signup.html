<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up-Employee Management System</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>

<body>
    <div class=" container m-auto mt-5 shadow rounded p-5" style="max-width: 400px; width: 100%;">
        <h1 class="fw-bold text-primary-emphasis ">GoFinance</h1>
        <p class="mb-4 text-muted">The most popular peer to peer lending at SEA</p>
        <h3 class="text-center fw-bold mb-4 text-primary-emphasis">Create Account</h3>

        <form>

            <div class="mb-3">
                <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control bg-light border-0" placeholder="Username" required>
            </div>


            <div class="mb-3">
                <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control bg-light border-0" placeholder="E-mail" required>
            </div>


            <div class="mb-4">
                <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control bg-light border-0" placeholder="Password" required>
            </div>


            <div class="d-flex justify-content-between">
                <a href="Dashborad.html"> <button type="submit" class="btn text-white fw-semibold flex-fill me-2 bg-primary">
          SIGN UP
        </button></a>

                <a href="index.html"><button type="button" class="btn btn-outline-primary text-secondary-emphasis fw-semibold flex-fill ms-2 ">
          SIGN IN
        </button></a>
            </div>
        </form>
    </div>

    <script src="bootstrap.bundle.js"></script>
</body>

</html>
